# Render Blueprint — see https://render.com/docs/blueprint-spec
#
# Defines one production deployment: the API service plus its own managed
# Postgres and Redis (Key Value) instances, wired together automatically.
# To run a separate staging environment, create a second Render service from
# this same repo/branch with its own env var values — Render doesn't require
# a second blueprint file for that.
#
# Region: Singapore — closest Render region to India (this app's audience).
# Change every `region:` below together if that's no longer true for you.

services:
  - name: prepjee-backend
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_VERSION
        value: 1.0.0

      # Must be a specific origin, never "*" — env.js refuses to boot in
      # production with a wildcard (see Phase 18's CORS hardening guard).
      - key: CORS_ORIGIN
        sync: false

      - key: DATABASE_URL
        fromDatabase:
          name: prepjee-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: prepjee-redis
          property: connectionString

      # Generate distinct secrets per environment, e.g.:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      - key: ADMIN_JWT_EXPIRY
        value: 12h

      # Optional — leave blank in the Render dashboard until Google sign-in
      # is wired up.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # Cloudflare R2 — filled in from your own R2 bucket's credentials.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false

      # Razorpay — use LIVE keys here, not the rzp_test_* ones from local dev.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

      # Optional — analytics are silently disabled if left blank.
      - key: AMPLITUDE_API_KEY
        sync: false

  - name: prepjee-redis
    type: keyvalue
    plan: starter
    region: singapore
    ipAllowList: [] # empty = only Render services in this account can reach it

databases:
  - name: prepjee-postgres
    plan: basic-256mb
    region: singapore
